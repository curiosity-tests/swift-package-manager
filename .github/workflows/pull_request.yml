name: Pull request

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Pull request ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    needs: [soundness]
    strategy:
      fail-fast: false
    name: Build
    uses: curiosity-tests/github-workflows/.github/workflows/swift_package_test.yml@0.0.15-racecar
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      enable_cross_pr_testing: true
      linux_os_versions: '["amazonlinux2023", "bookworm", "noble", "jammy", "rhel-ubi9"]'
      linux_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      linux_pre_build_command: ./.github/scripts/prebuild.sh
      linux_build_command: 'swift run swift-build --build-tests'
      windows_build_timeout: 180
      windows_swift_versions: '["nightly-main", "nightly-6.4.x",]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_build_command: 'Invoke-Program swift run -Xlinker /ignore:4217 --configuration release swift-build --build-tests --scratch-path .tests'
      # enable_android_sdk_build: true
      # android_sdk_build_command: "swift run swift-build --build-tests --build-system swiftbuild"
      # android_ndk_versions: '["r27d", "r29"]'
      enable_windows_checks: false
      enable_macos_checks: false
      macos_exclude_xcode_versions: "[{\"xcode_version\": \"swift_6.1\"}]"
      macos_build_command: 'swift run swift-build --build-tests'
      enable_ios_checks: false
      # ios_build_command: 'swift run swift-build --build-tests  --sdk \"$(xcrun --sdk iphoneos --show-sdk-path)\" --triple arm64-apple-ios'
      enable_freebsd_checks: false
      freebsd_pre_build_command: ./.github/scripts/prebuild.sh
      freebsd_build_command: 'set -x; swift --version; swift build --build-tests; set +x'
      # freebsd_host_archs: '["aarch64", "x86_64"]' # FreeBSD builds currently only support x86_64

  test-example-package-registry:
    strategy:
      fail-fast: false
    name: Build and Test Example Package Registry
    uses: curiosity-tests/github-workflows/.github/workflows/swift_package_test.yml@0.0.15-racecar
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      enable_cross_pr_testing: false
      enable_linux_checks: true
      linux_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      linux_build_command: 'set -x; cd Examples/package-registry && swift test --parallel; set +x'
      enable_windows_checks: false  # https://github.com/swiftlang/swift-package-manager/issues/10326
      windows_swift_versions: '["nightly-main"]'
      # windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1 -InstallZlib -SkipAndroid'
      windows_build_timeout: 180
      windows_build_command: 'cd Examples\package-registry; Invoke-program swift test --parallel'
      enable_macos_checks: false
      macos_xcode_versions: "['swift_6.4']"
      macos_build_command: 'set -x; cd Examples/package-registry && xcrun swift test --parallel; set +x'
      enable_ios_checks: false

  soundness:
    name: Soundness
    uses: curiosity-tests/github-workflows/.github/workflows/soundness.yml@0.0.15-racecar
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      license_header_check_project_name: "Swift"
      license_header_check_enabled: true
      unacceptable_language_check_enabled: true
      api_breakage_check_enabled: false
      format_check_enabled: false
      shell_check_enabled: false
      docs_check_enabled: true
      docs_check_analyze: false
      docs_check_targets: "PackageManagerDocs"
      docs_check_macos_enabled: false
      broken_symlink_check_enabled: true
      python_lint_check_enabled: true
      yamllint_check_enabled: true

  integration-tests:
    name: Integration Tests
    needs: [soundness]
    uses: curiosity-tests/github-workflows/.github/workflows/swift_package_test.yml@0.0.15-racecar
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      enable_linux_checks: false
      enable_windows_checks: false
      enable_macos_checks: false
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-main"]'
      wasm_sdk_pre_build_command: ./.github/scripts/prebuild.sh
      # This is a hack - replace the build command with a test command and drop the --swift-sdk arg the workflow appends.
      wasm_sdk_build_command: "swift test --parallel --experimental-xunit-message-failure --xunit-output wasm-xunit.xml --filter WebAssemblyIntegrationTests #"
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["nightly-main"]'
      linux_static_sdk_pre_build_command: ./.github/scripts/prebuild.sh
      # This is a hack - replace the build command with a test command and drop the --swift-sdk arg the workflow appends.
      linux_static_sdk_build_command: "swift test --parallel --experimental-xunit-message-failure --xunit-output static-linux-xunit.xml --filter StaticLinuxIntegrationTests #"
      enable_android_sdk_build: true
      android_sdk_build_command: "swift test  --parallel --experimental-xunit-message-failure --xunit-output android-xunit.xml --filter AndroidSDKIntegrationTests #"

  build-verdict:
    name: Build Verdict
    runs-on: ubuntu-latest
    needs:
    - build
    - test-example-package-registry
    - soundness
    - integration-tests
    if: always()  # Runs even if previous jobs fail so it can evaluate them
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Install required tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends coreutils jq
    - name: Check upstream job statuses
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result != "success")) | .[] | "\(.key): \(.value.result)"')
        if [ -n "$failed" ]; then
          echo "The following required jobs did not succeed:"
          printf '%s\n' "$failed"
          exit 1
        fi
        echo "All required jobs passed successfully!"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
